name: Validate pages.json

on:
  pull_request:
    paths:
      - 'pages.json'

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Validate pages.json
        id: validate
        run: |
          node - <<'EOF'
          const fs = require('fs')

          let raw
          try {
            raw = fs.readFileSync('pages.json', 'utf8')
          } catch (e) {
            const msg = 'Could not read pages.json: ' + e.message
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `message<<ENDOFMSG\n${msg}\nENDOFMSG\n`)
            process.exit(1)
          }

          let data
          try {
            data = JSON.parse(raw)
          } catch (e) {
            const msg = 'Invalid JSON: ' + e.message
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `message<<ENDOFMSG\n${msg}\nENDOFMSG\n`)
            process.exit(1)
          }

          const errors = []

          if (!data.projects || !Array.isArray(data.projects)) {
            errors.push('Missing or invalid "projects" array at root')
          } else {
            data.projects.forEach((project, pi) => {
              const prefix = `projects[${pi}] ("${project.name ?? '?'}")`

              if (!project.name)   errors.push(`${prefix}: missing "name"`)
              if (!project.repo)   errors.push(`${prefix}: missing "repo"`)
              if (!project.author) errors.push(`${prefix}: missing "author"`)

              if (!project.pages || !Array.isArray(project.pages)) {
                errors.push(`${prefix}: missing or invalid "pages" array`)
              } else {
                project.pages.forEach((page, pgi) => {
                  const pprefix = `${prefix}.pages[${pgi}] ("${page.title ?? '?'}")`
                  if (!page.title) errors.push(`${pprefix}: missing "title"`)
                  if (!page.url)   errors.push(`${pprefix}: missing "url"`)

                  if (page.embed !== undefined && typeof page.embed !== 'boolean')
                    errors.push(`${pprefix}: "embed" must be a boolean`)
                  if (page.pdf !== undefined && typeof page.pdf !== 'boolean')
                    errors.push(`${pprefix}: "pdf" must be a boolean`)
                })
              }
            })
          }

          if (errors.length > 0) {
            const msg = errors.map(e => '- ' + e).join('\n')
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `message<<ENDOFMSG\n${msg}\nENDOFMSG\n`)
            process.exit(1)
          }

          const msg = `${data.projects.length} project(s) — all good`
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `message<<ENDOFMSG\n${msg}\nENDOFMSG\n`)
          EOF
        continue-on-error: true

      - name: Comment failure
        if: steps.validate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `${{ steps.validate.outputs.message }}`
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ pages.json validation failed\n\n\`\`\`\n${msg}\n\`\`\``
            })
            core.setFailed('pages.json is invalid')

      - name: Comment success
        if: steps.validate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const msg = `${{ steps.validate.outputs.message }}`
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ✅ pages.json is valid — ${msg}`
            })
